<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>O Rei Sem Rosto — Minha Biblioteca</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08080b;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
button{
  border:0;border-radius:14px;padding:12px 16px;
  background:#fff;color:#111;font-weight:700;font-size:14px;
  cursor:pointer;transition:.15s;box-shadow:0 4px 18px #0007
}
button:active{transform:scale(.96)}
button:disabled{opacity:.35}
.header{
  text-align:center;padding:18px 14px 12px;
  background:linear-gradient(180deg,#15151b,#0a0a0d);
  position:sticky;top:0;z-index:20;border-bottom:1px solid #24242b
}
.header h1{margin:0;font-size:21px}
.header p{margin:5px 0 0;color:#92929d;font-size:12px}
main{max-width:1100px;margin:auto;padding:14px}
#biblioteca{display:block}
.card{
  max-width:330px;margin:20px auto;background:#121217;
  border:1px solid #292931;border-radius:20px;padding:14px;
  box-shadow:0 12px 35px #0008;text-align:center
}
.cover{
  width:100%;aspect-ratio:2/3;overflow:hidden;border-radius:13px;
  background:#1d1d23
}
.cover img{width:100%;height:100%;object-fit:cover}
.card h2{font-size:21px;margin:15px 0 6px}
.card p{color:#9999a3;margin:0 0 14px}
.primary{background:#fff;color:#111}
#leitor{display:none}
.reader-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  position:sticky;top:68px;z-index:15;padding:8px 0;
  background:#08080bee;backdrop-filter:blur(12px)
}
.reader-title{font-weight:700;text-align:center;flex:1;font-size:14px}
.icon-btn{width:44px;height:42px;padding:0;font-size:19px}
#pagina{
  width:100%;display:flex;justify-content:center;align-items:flex-start;
  padding:8px 0 95px;min-height:65vh
}
#pageCanvas{
  display:block;max-width:100%;height:auto;
  border-radius:4px;box-shadow:0 10px 40px #0009;
  background:#0b0b0e
}
.controls{
  position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
  z-index:30;display:flex;align-items:center;gap:8px;
  padding:8px;background:#15151bd9;border:1px solid #34343d;
  border-radius:18px;backdrop-filter:blur(14px);
  box-shadow:0 10px 35px #000b;max-width:calc(100vw - 20px)
}
.controls button{min-width:46px;height:44px;padding:0}
.side-nav{
  position:fixed;top:50%;transform:translateY(-50%);
  z-index:1100;width:54px;height:72px;border:1px solid #34343d;
  border-radius:18px;background:#15151bd9;color:#fff;font-size:44px;
  line-height:1;display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(14px);box-shadow:0 8px 28px #0009;
  -webkit-tap-highlight-color:transparent;
}
.side-prev{left:10px}
.side-next{right:10px}
body.modo-tela-cheia .side-nav{display:flex}
body.modo-tela-cheia .header{display:none}
body.modo-tela-cheia main{padding:0}
body.modo-tela-cheia .reader-top{top:0}
body.modo-tela-cheia #pagina{padding-top:4px}
@media(max-width:480px){
  .side-nav{width:46px;height:64px;font-size:38px}
  .side-prev{left:7px}.side-next{right:7px}
}
#pageInfo{min-width:82px;text-align:center;font-size:12px;color:#ddd}
.progress{
  position:fixed;left:0;bottom:0;height:3px;background:#fff;
  z-index:40;width:0%;transition:width .2s
}
.loading{
  min-height:60vh;display:flex;align-items:center;justify-content:center;
  color:#aaa;font-size:14px;text-align:center;padding:30px
}
#erro{display:none;color:#ffb4b4;text-align:center;padding:30px}
.small{font-size:11px;color:#777;text-align:center;margin-top:10px}
@media(min-width:700px){
  main{padding:20px}
  #pagina{padding-bottom:110px}
  #pageCanvas{max-height:calc(100vh - 150px);width:auto;max-width:92vw}
}
</style>
</head>
<body>

<header class="header">
  <h1>📚 Minha Biblioteca</h1>
  <p>O Rei Sem Rosto</p>
</header>

<main>
<section id="biblioteca">
  <div class="card">
    <div class="cover">
      <img src="Screenshot_20260909-190353~3.jpg" alt="Capa de O Rei Sem Rosto">
    </div>
    <h2>O Rei Sem Rosto</h2>
    <p>Livro completo — 63 páginas.</p>
    <button class="primary" onclick="abrirLivro()">▶ Ler livro</button>
  </div>
</section>

<section id="leitor">
  <div class="reader-top">
    <button class="icon-btn" onclick="voltarBiblioteca()" title="Biblioteca">←</button>
    <div class="reader-title">O Rei Sem Rosto</div>
    <button class="icon-btn" onclick="toggleCinema()" title="Modo cinema">⛶</button>
  </div>

  <div id="pagina">
    <div class="loading" id="loading">Carregando livro...<br>Isso pode levar alguns segundos na primeira vez.</div>
    <canvas id="pageCanvas" style="display:none"></canvas>
  </div>

  <div id="erro"></div>
</section>
</main>

<button class="side-nav side-prev" id="sidePrev" onclick="paginaAnterior()" aria-label="Página anterior">‹</button>
<button class="side-nav side-next" id="sideNext" onclick="proximaPagina()" aria-label="Próxima página">›</button>

<div class="controls" id="controls" style="display:none">
  <button id="prev" onclick="paginaAnterior()">←</button>
  <div id="pageInfo">1 / 63</div>
  <button id="next" onclick="proximaPagina()">→</button>
  <button onclick="salvarPosicao()" title="Salvar posição">🔖</button>
</div>
<div class="progress" id="progress"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const PDF_URL = "O-Rei-Sem-Rosto.pdf";
const TOTAL_FALLBACK = 63;
const STORAGE_KEY = "orei_sem_rosto_estado_v4";
const VIEW_KEY = "orei_sem_rosto_tela_v1";

let pdf = null;
let paginaAtual = 1;
let carregado = false;
let renderToken = 0;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function salvarEstado(view){
  const estado={view:view, pagina:paginaAtual};
  localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
  sessionStorage.setItem(VIEW_KEY, view);
}
function salvarPosicao(){
  salvarEstado("leitor");
  atualizarUI();
}
function lerEstado(){
  try{
    const e=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    const sess=sessionStorage.getItem(VIEW_KEY);
    if(sess==="biblioteca") return {view:"biblioteca", pagina:e?.pagina||1};
    if(sess==="leitor") return {view:"leitor", pagina:e?.pagina||1};
    return e && (e.view==="leitor" || e.view==="biblioteca") ? e : {view:"biblioteca",pagina:1};
  }catch(_){ return {view:"biblioteca",pagina:1}; }
}
function lerPosicao(){
  const e=lerEstado();
  const n=parseInt(e.pagina||1,10);
  return Number.isFinite(n)&&n>=1?n:1;
}

async function abrirLivro(){
  // Primeiro recupera a última página salva; só depois muda a tela para o leitor.
  // Isso evita que uma recarga sobrescreva a posição com a página 1.
  const salvaAntesDeAbrir = lerPosicao();
  salvarEstado("leitor");
  paginaAtual = salvaAntesDeAbrir;
  document.getElementById("biblioteca").style.display="none";
  document.getElementById("leitor").style.display="block";
  document.getElementById("controls").style.display="flex";
  window.scrollTo(0,0);

  if(carregado){
    renderPagina(paginaAtual);
    return;
  }

  document.getElementById("loading").style.display="flex";
  document.getElementById("pageCanvas").style.display="none";
  document.getElementById("erro").style.display="none";

  try{
    pdf = await pdfjsLib.getDocument({
      url: PDF_URL,
      disableAutoFetch:false,
      disableStream:false
    }).promise;

    carregado = true;
    paginaAtual = Math.min(salvaAntesDeAbrir, pdf.numPages);
    await renderPagina(paginaAtual);
  }catch(e){
    console.error(e);
    document.getElementById("loading").style.display="none";
    const erro=document.getElementById("erro");
    erro.style.display="block";
    erro.innerHTML =
      "Não foi possível carregar o livro.<br><br>" +
      "Verifique se <b>O-Rei-Sem-Rosto.pdf</b> está no mesmo repositório do site.";
  }
}

async function renderPagina(numero){
  if(!pdf) return;
  numero=Math.max(1,Math.min(numero,pdf.numPages));
  paginaAtual=numero;
  const token=++renderToken;

  document.getElementById("loading").style.display="flex";
  document.getElementById("pageCanvas").style.display="none";

  try{
    const page=await pdf.getPage(numero);
    if(token!==renderToken)return;

    const base=page.getViewport({scale:1});
    const maxWidth=Math.min(window.innerWidth-12,1100);
    const scale=maxWidth/base.width;
    const viewport=page.getViewport({scale:Math.max(scale,1)});

    const canvas=document.getElementById("pageCanvas");
    const ctx=canvas.getContext("2d",{alpha:false});

    canvas.width=Math.floor(viewport.width);
    canvas.height=Math.floor(viewport.height);

    await page.render({
      canvasContext:ctx,
      viewport:viewport,
      background:"#ffffff"
    }).promise;

    if(token!==renderToken)return;

    // Remove automaticamente as grandes bordas brancas do PDF.
    cortarBordasBrancas(canvas);

    document.getElementById("loading").style.display="none";
    canvas.style.display="block";
    atualizarUI();
    salvarPosicaoSilencioso();
    window.scrollTo({top:0,behavior:"instant"});
  }catch(e){
    console.error(e);
  }
}

function cortarBordasBrancas(canvas){
  const ctx=canvas.getContext("2d");
  const w=canvas.width,h=canvas.height;
  const step=4;
  const data=ctx.getImageData(0,0,w,h).data;

  let minX=w,minY=h,maxX=-1,maxY=-1;

  for(let y=0;y<h;y+=step){
    for(let x=0;x<w;x+=step){
      const i=(y*w+x)*4;
      const r=data[i],g=data[i+1],b=data[i+2];
      if(r<242 || g<242 || b<242){
        if(x<minX)minX=x;
        if(y<minY)minY=y;
        if(x>maxX)maxX=x;
        if(y>maxY)maxY=y;
      }
    }
  }

  if(maxX<0)return;

  const pad=3;
  minX=Math.max(0,minX-pad);
  minY=Math.max(0,minY-pad);
  maxX=Math.min(w-1,maxX+pad);
  maxY=Math.min(h-1,maxY+pad);

  const cw=maxX-minX+1,ch=maxY-minY+1;

  // Só corta se realmente houver uma margem relevante.
  if(cw < w*0.98 || ch < h*0.98){
    const temp=document.createElement("canvas");
    temp.width=cw;temp.height=ch;
    temp.getContext("2d").drawImage(
      canvas,minX,minY,cw,ch,0,0,cw,ch
    );
    canvas.width=cw;canvas.height=ch;
    ctx.drawImage(temp,0,0);
  }
}

function salvarPosicaoSilencioso(){
  salvarEstado("leitor");
}

function atualizarUI(){
  const total=pdf ? pdf.numPages : TOTAL_FALLBACK;
  document.getElementById("pageInfo").textContent =
    paginaAtual+" / "+total;
  const atStart = paginaAtual<=1;
  const atEnd = paginaAtual>=total;
  document.getElementById("prev").disabled=atStart;
  document.getElementById("next").disabled=atEnd;
  document.getElementById("sidePrev").disabled=atStart;
  document.getElementById("sideNext").disabled=atEnd;
  document.getElementById("progress").style.width =
    ((paginaAtual/total)*100)+"%";
}

async function proximaPagina(){
  if(pdf && paginaAtual<pdf.numPages){
    await renderPagina(paginaAtual+1);
  }
}

async function paginaAnterior(){
  if(pdf && paginaAtual>1){
    await renderPagina(paginaAtual-1);
  }
}

function voltarBiblioteca(){
  salvarEstado("biblioteca");
  renderToken++;
  document.getElementById("leitor").style.display="none";
  document.getElementById("biblioteca").style.display="block";
  document.getElementById("controls").style.display="none";
  document.getElementById("progress").style.width="0";
  window.scrollTo(0,0);
  // A posição continua salva para quando o usuário abrir o livro novamente.
}

function toggleCinema(){
  // Não usa a API de tela cheia do celular. Apenas amplia o leitor dentro da página.
  document.body.classList.toggle("modo-tela-cheia");
  const btn=document.querySelector('.reader-top .icon-btn:last-child');
  if(btn) btn.textContent=document.body.classList.contains("modo-tela-cheia") ? "✕" : "⛶";
}

window.addEventListener("resize",()=>{
  if(carregado && document.getElementById("leitor").style.display!=="none"){
    clearTimeout(window.__resizeTimer);
    window.__resizeTimer=setTimeout(()=>renderPagina(paginaAtual),250);
  }
});

// Mantém a tela em que o usuário estava quando recarregou:
// - se estava lendo, reabre o livro na última página salva;
// - se voltou para a biblioteca, continua na biblioteca.
window.addEventListener("load",()=>{
  const estado=lerEstado();
  // Na primeira abertura desta versão, a tela padrão é a Biblioteca.
  if(!sessionStorage.getItem(VIEW_KEY)){
    sessionStorage.setItem(VIEW_KEY, estado.view);
  }
  if(estado.view==="leitor") abrirLivro();
  else {
    document.getElementById("biblioteca").style.display="block";
    document.getElementById("leitor").style.display="none";
    document.getElementById("controls").style.display="none";
  }
});

// Garante que atualizar/fechar a página preserve exatamente a tela atual.
function preservarTelaAtual(){
  const leitorVisivel=document.getElementById("leitor").style.display!=="none";
  const view=leitorVisivel ? "leitor" : "biblioteca";
  localStorage.setItem(STORAGE_KEY, JSON.stringify({view:view, pagina:paginaAtual}));
  sessionStorage.setItem(VIEW_KEY, view);
}
window.addEventListener("beforeunload", preservarTelaAtual);
window.addEventListener("pagehide", preservarTelaAtual);
</script>
</body>
</html>
