<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Biblioteca — O Rei Sem Rosto</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #0b0b0f;
  color: white;
}

header {
  padding: 28px 20px 18px;
  text-align: center;
  background: linear-gradient(180deg, #15151d, #0b0b0f);
}

header h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

header p {
  margin: 0;
  color: #aaa;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 24px 16px 40px;
}

.grade {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
}

.card {
  background: #17171e;
  border: 1px solid #292932;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(0,0,0,.35);
}

.capa {
  height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #222;
  overflow: hidden;
}

.capa img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.capa .placeholder {
  font-size: 70px;
}

.card-content {
  padding: 16px;
}

.card h2 {
  margin: 0 0 8px;
  font-size: 21px;
}

.card p {
  margin: 0 0 15px;
  color: #bbb;
  line-height: 1.4;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  background: white;
  color: #111;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

button:hover {
  opacity: .9;
}

#leitor {
  display: none;
}

.topbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 16px;
}

.topbar h2 {
  margin: 0;
  flex: 1;
  min-width: 180px;
}

.pdf-box {
  background: #17171e;
  border: 1px solid #292932;
  border-radius: 14px;
  padding: 10px;
}

iframe {
  width: 100%;
  height: 75vh;
  min-height: 500px;
  border: 0;
  border-radius: 8px;
  background: white;
}

.aviso {
  text-align: center;
  color: #aaa;
  padding: 12px 4px 2px;
  font-size: 14px;
}

.link-pdf {
  color: white;
}

footer {
  text-align: center;
  color: #777;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>📚 Minha Biblioteca</h1>
  <p>Escolha uma história para começar a leitura.</p>
</header>

<main>

<section id="biblioteca">

  <div class="grade">

    <article class="card">

      <div class="capa">

        <img
          src="Screenshot_20260909-190353~3.jpg"
          alt="Capa de O Rei Sem Rosto"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
        >

        <div class="placeholder" style="display:none">
          📖
        </div>

      </div>

      <div class="card-content">

        <h2>O Rei Sem Rosto</h2>

        <p>
          Livro completo em formato digital.
        </p>

        <button onclick="abrirLivro()">
          ▶ Ler livro
        </button>

      </div>

    </article>

  </div>

</section>


<section id="leitor">

  <div class="topbar">

    <button onclick="voltarBiblioteca()">
      ← Biblioteca
    </button>

    <h2>
      O Rei Sem Rosto
    </h2>

  </div>


  <div class="pdf-box">

    <iframe
      id="pdfViewer"
      title="Leitor de O Rei Sem Rosto">
    </iframe>

    <div class="aviso">

      Se o leitor não abrir no seu celular,
      <a
        class="link-pdf"
        href="O-Rei-Sem-Rosto.pdf"
        target="_blank">
        abra o PDF diretamente
      </a>.

    </div>

  </div>

</section>

</main>


<footer>
  O Rei Sem Rosto
</footer>


<script>

function abrirLivro() {

  localStorage.setItem(
    "livroAberto",
    "true"
  );

  document.getElementById(
    "biblioteca"
  ).style.display = "none";

  document.getElementById(
    "leitor"
  ).style.display = "block";


  var viewer =
    document.getElementById(
      "pdfViewer"
    );


  if (!viewer.src) {

    viewer.src =
      "O-Rei-Sem-Rosto.pdf#page=1&view=FitH";

  }


  window.scrollTo(0, 0);
}


function voltarBiblioteca() {

  localStorage.removeItem(
    "livroAberto"
  );


  document.getElementById(
    "leitor"
  ).style.display = "none";

  document.getElementById(
    "biblioteca"
  ).style.display = "block";


  window.scrollTo(0, 0);
}


window.addEventListener(
  "load",
  function() {

    if (
      localStorage.getItem(
        "livroAberto"
      ) === "true"
    ) {

      abrirLivro();

    }

  }
);

</script>

</body>
</html>
