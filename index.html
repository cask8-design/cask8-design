<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Rei Sem Rosto</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
header{
  text-align:center;
  padding:24px 16px 14px;
}
header h1{margin:0 0 6px;font-size:26px}
header p{margin:0;color:#aaa}

main{max-width:900px;margin:auto;padding:16px}

#biblioteca{display:block}

.card{
  max-width:360px;
  margin:10px auto;
  background:#17171e;
  border:1px solid #30303a;
  border-radius:16px;
  overflow:hidden;
}
.capa{
  height:430px;
  background:#222;
}
.capa img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.card-content{padding:18px}
.card h2{margin:0 0 8px}
.card p{color:#aaa}
button{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  background:#fff;
  color:#111;
  font-weight:bold;
  font-size:15px;
}
button:active{transform:scale(.98)}

#leitor{display:none}

.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}
.topbar h2{
  margin:0;
  font-size:20px;
  flex:1;
}

.controles{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin:12px 0;
  flex-wrap:wrap;
}
.controles span{color:#bbb}

#pagina{
  text-align:center;
  min-height:300px;
  margin:0 -16px;
  overflow:hidden;
  background:#050507;
}
#pagina canvas{
  display:block;
  max-width:100%;
  height:auto;
  margin:0 auto;
  background:transparent;
}

.carregando{
  color:#aaa;
  padding:80px 10px;
}

.erro{
  color:#ffb0b0;
  text-align:center;
  padding:30px 10px;
  line-height:1.5;
}

#leitor{
  background:#050507;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:10;
  padding:10px 0;
  background:rgba(5,5,7,.94);
  backdrop-filter:blur(8px);
}

.controles{
  position:sticky;
  bottom:12px;
  z-index:10;
  width:max-content;
  max-width:calc(100% - 20px);
  margin:14px auto;
  padding:7px;
  border-radius:14px;
  background:rgba(20,20,25,.94);
  border:1px solid #33333d;
  box-shadow:0 8px 25px rgba(0,0,0,.45);
}

.controles button{
  padding:10px 13px;
}

.controles span{
  min-width:105px;
  text-align:center;
  font-size:14px;
}

@media (max-width:600px){
  main{padding:0 16px 20px}
  #leitor{margin:0 -16px;padding:0 16px}
  #pagina{margin:0 -16px}
  .topbar h2{font-size:17px}
}

footer{
  text-align:center;
  color:#666;
  padding:25px;
}
</style>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"></script>
</head>

<body>

<header>
  <h1>📚 Minha Biblioteca</h1>
  <p>O Rei Sem Rosto</p>
</header>

<main>

<section id="biblioteca">
  <article class="card">
    <div class="capa">
      <img src="Screenshot_20260909-190353~3.jpg"
           alt="Capa de O Rei Sem Rosto"
           onerror="this.style.display='none'">
    </div>

    <div class="card-content">
      <h2>O Rei Sem Rosto</h2>
      <p>Livro completo — 63 páginas.</p>
      <button onclick="abrirLivro()">▶ Ler livro</button>
    </div>
  </article>
</section>


<section id="leitor">

  <div class="topbar">
    <button onclick="voltarBiblioteca()">←</button>
    <h2>O Rei Sem Rosto</h2>
  </div>

  <div class="controles">
    <button onclick="paginaAnterior()">← Anterior</button>
    <span id="numeroPagina">Página 1 / 63</span>
    <button onclick="proximaPagina()">Próxima →</button>
  </div>

  <div id="pagina">
    <div class="carregando">Carregando livro...</div>
  </div>

</section>

</main>

<footer>O Rei Sem Rosto</footer>

<script type="module">
import * as pdfjsLib from
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

var pdf = null;
var paginaAtual = 1;
var totalPaginas = 63;
var carregandoPagina = false;

async function carregarPDF(){
  try{
    pdf = await pdfjsLib.getDocument("O-Rei-Sem-Rosto.pdf").promise;
    totalPaginas = pdf.numPages;
    paginaAtual = 1;
    await mostrarPagina();
  }catch(e){
    document.getElementById("pagina").innerHTML =
      '<div class="erro">Não foi possível carregar o livro.<br><br>' +
      'Verifique se o arquivo <b>O-Rei-Sem-Rosto.pdf</b> está no GitHub.</div>';
    console.error(e);
  }
}

async function mostrarPagina(){
  if(!pdf || carregandoPagina) return;
  carregandoPagina = true;

  var area = document.getElementById("pagina");
  area.innerHTML = '<div class="carregando">Carregando página...</div>';

  try{
    var page = await pdf.getPage(paginaAtual);

    var baseViewport = page.getViewport({scale:1});
    var larguraMaxima = Math.min(window.innerWidth, 900);
    var escala = larguraMaxima / baseViewport.width;

    // Renderiza em resolução maior para manter a imagem nítida.
    var qualidade = Math.min(window.devicePixelRatio || 1, 2);
    var viewport = page.getViewport({scale:escala * qualidade});

    var canvas = document.createElement("canvas");
    var context = canvas.getContext("2d", {willReadFrequently:true});

    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    area.innerHTML = "";
    area.appendChild(canvas);

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    // Remove somente o branco que está conectado às bordas da página.
    // Assim a margem branca desaparece, mas balões/áreas brancas dentro do manhwa continuam.
    removerMargemBranca(canvas);

    document.getElementById("numeroPagina").textContent =
      "Página " + paginaAtual + " / " + totalPaginas;

    window.scrollTo(0,0);

  }catch(e){
    area.innerHTML =
      '<div class="erro">Erro ao carregar esta página.</div>';
    console.error(e);
  }

  carregandoPagina = false;
}

function removerMargemBranca(canvas){
  var ctx = canvas.getContext("2d", {willReadFrequently:true});
  var img = ctx.getImageData(0,0,canvas.width,canvas.height);
  var data = img.data;
  var w = canvas.width;
  var h = canvas.height;

  function branco(i){
    return data[i] > 244 &&
           data[i+1] > 244 &&
           data[i+2] > 244 &&
           data[i+3] > 0;
  }

  var visitado = new Uint8Array(w*h);
  var fila = new Int32Array(w*h);
  var inicio = 0, fim = 0;

  function adicionar(x,y){
    if(x<0 || x>=w || y<0 || y>=h) return;
    var p = y*w+x;
    if(visitado[p]) return;
    var i = p*4;
    if(!branco(i)) return;
    visitado[p] = 1;
    fila[fim++] = p;
  }

  for(var x=0;x<w;x++){
    adicionar(x,0);
    adicionar(x,h-1);
  }
  for(var y=0;y<h;y++){
    adicionar(0,y);
    adicionar(w-1,y);
  }

  while(inicio < fim){
    var p = fila[inicio++];
    var x = p % w;
    var y = (p - x) / w;
    var i = p*4;

    data[i+3] = 0;

    adicionar(x+1,y);
    adicionar(x-1,y);
    adicionar(x,y+1);
    adicionar(x,y-1);
  }

  ctx.putImageData(img,0,0);
}
window.abrirLivro = function(){
  localStorage.setItem("livroAberto","true");

  document.getElementById("biblioteca").style.display="none";
  document.getElementById("leitor").style.display="block";

  if(!pdf){
    carregarPDF();
  }else{
    mostrarPagina();
  }

  window.scrollTo(0,0);
};

window.voltarBiblioteca = function(){
  localStorage.removeItem("livroAberto");

  document.getElementById("leitor").style.display="none";
  document.getElementById("biblioteca").style.display="block";

  window.scrollTo(0,0);
};

window.proximaPagina = function(){
  if(paginaAtual < totalPaginas){
    paginaAtual++;
    mostrarPagina();
  }
};

window.paginaAnterior = function(){
  if(paginaAtual > 1){
    paginaAtual--;
    mostrarPagina();
  }
};

window.addEventListener("load",function(){
  if(localStorage.getItem("livroAberto")==="true"){
    abrirLivro();
  }
});

window.addEventListener("resize",function(){
  if(pdf && document.getElementById("leitor").style.display==="block"){
    mostrarPagina();
  }
});
</script>

</body>
</html>
